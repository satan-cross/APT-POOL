kind = "web"
previewPath = "/"
title = "Security Mining Command Center"
description = "A live defensive security workload command center with verifiable proof-of-work telemetry, an authoritative local DNS probe, a miner pool simulator, and an 18-workload execution matrix."
version = "1.0.0"
id = "artifacts/security-command-center"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20327

[services.development]
run = "pnpm --filter @workspace/security-command-center run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/security-command-center", "run", "build" ]
serve = "static"
publicDir = "artifacts/security-command-center/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20327"
BASE_PATH = "/"
